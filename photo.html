<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#eef0ed;font:12px system-ui;color:#163e35}img{width:100%;height:100vh;object-fit:contain;display:block;cursor:zoom-in}#error{padding:35px 15px;text-align:center;line-height:1.7}a{color:inherit}[hidden]{display:none!important}</style></head><body><img id="photo" alt=""><div id="error" hidden>Fotografii se nepodařilo načíst. <a id="source" target="_blank" rel="noopener noreferrer">Otevřít původní zdroj ↗</a></div><script>const q=new URLSearchParams(location.search),img=document.querySelector('img');img.alt=q.get('alt')||'Fotografie vozu';img.src=q.get('src')||'';let retried=false;img.onerror=()=>{if(!retried&&q.get('original')){retried=true;img.src=q.get('original')}else{img.hidden=true;document.querySelector('#error').hidden=false}};document.querySelector('#source').href=q.get('source')||q.get('original')||'#';img.onclick=()=>parent.postMessage({type:'zoom',id:q.get('id'),angle:q.get('angle')},location.origin);</script></body></html>
